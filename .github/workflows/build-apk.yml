release:
  needs: build
  runs-on: ubuntu-latest
  if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
  timeout-minutes: 30

  steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'
      cache: 'gradle'

  - name: Grant execute permission for gradlew
    run: chmod +x gradlew

  - name: Build Release APK and AAB (unsigned)
    run: ./gradlew assembleRelease bundleRelease --no-daemon -Pandroid.injected.signing.store.file=/tmp/keystore.jks -Pandroid.injected.signing.store.password=dummy -Pandroid.injected.signing.key.alias=dummy -Pandroid.injected.signing.key.password=dummy
    # هذه الطريقة تسمح ببناء إصدار غير موقّع للتجربة

  - name: Upload Release APK
    uses: actions/upload-artifact@v4
    with:
      name: app-release
      path: app/build/outputs/apk/release/*.apk

  - name: Upload Release AAB
    uses: actions/upload-artifact@v4
    with:
      name: app-bundle
      path: app/build/outputs/bundle/release/*.aab
